# Hält das Supabase-Free-Projekt wach. Supabase pausiert Projekte nach 7 Tagen ohne
# "ausreichende" Aktivität und nennt die Schwelle nicht.
#
# Was bereits nicht gereicht hat:
#   - alle 2 Tage lesen, Antwort leer    -> Warnung am 05.10.2026
#   - täglich lesen, Antwort mit Inhalt  -> Warnung am 13.10.2026, obwohl jeder
#     Lauf nachweislich HTTP 200 mit einer echten Zeile bekam
# Lesen zählt also offenbar nicht. Deshalb jetzt: dreimal täglich wirklich SCHREIBEN,
# über die Funktion touch_heartbeat, die den Zeitstempel der einen heartbeat-Zeile setzt.
#
# Der zweite Schritt committet sein Laufdatum, damit GitHub den Zeitplan nicht nach
# 60 Tagen Inaktivität abschaltet. Er läuft auch bei Fehlschlag – sonst würde eine
# längere Störung zusätzlich den Zeitplan abwürgen.
name: Supabase Wecker
on:
  schedule:
    - cron: "17 6,12,18 * * *"   # dreimal täglich, 06:17 / 12:17 / 18:17 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Datenbank beschreiben
        id: ping
        run: |
          KEY="sb_publishable_b9EbsvwSs8HPvnBw4_KvTw_cJ_CM3FK"
          resp=$(curl -s -w $'\n%{http_code}' -X POST \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://zsscsphixrupplaihhxo.supabase.co/rest/v1/rpc/touch_heartbeat")
          code=$(printf '%s' "$resp" | tail -n1)
          body=$(printf '%s' "$resp" | sed '$d')
          heute=$(date -u +%Y-%m-%d)
          echo "Antwort: $code  Zeitstempel: $body"
          if [ "$code" != "200" ]; then
            echo "Datenbank antwortet nicht (HTTP $code)."; exit 1
          fi
          # Der zurueckgegebene Zeitstempel muss von heute sein. Damit ist bewiesen,
          # dass wirklich geschrieben wurde - nicht nur, dass irgendetwas geantwortet hat.
          case "$body" in
            *"$heute"*) ;;
            *) echo "Zeitstempel nicht von heute - der Schreibvorgang hat nicht gegriffen."; exit 1 ;;
          esac
      - name: Laufdatum eintragen (hält den Zeitplan aktiv)
        if: always()
        run: |
          if [ "${{ steps.ping.outcome }}" = "success" ]; then S="beschrieben"; else S="NICHT erreichbar"; fi
          date -u +"%Y-%m-%d %H:%M UTC – Datenbank $S" > .github/wecker-letzter-lauf.txt
          git config user.name "fcwb-wecker"
          git config user.email "wecker@users.noreply.github.com"
          git add .github/wecker-letzter-lauf.txt
          git commit -m "Wecker: Datenbank angefragt" || exit 0
          git pull --rebase --autostash -q || true
          git push
